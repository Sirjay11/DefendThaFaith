<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defend the Faith</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/archive_engine.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900">

  <!-- ==================== QUIET HEADER ==================== -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-100">
    <div class="max-w-3xl mx-auto px-5 h-14 flex items-center justify-between gap-4">
      <button onclick="resetToHome()" class="flex items-center gap-2.5 text-left group focus:outline-none">
        <span class="w-6 h-6 rounded accent-bg text-white flex items-center justify-center text-[10px] font-bold tracking-wider transition">
          DF
        </span>
        <span class="text-sm font-semibold tracking-tight text-gray-900 group-hover:opacity-75 transition">
          Defend the Faith
        </span>
      </button>

      <nav class="flex items-center gap-4 text-xs text-gray-500">
        <button
          onclick="resetToHome()"
          id="nav-new-btn"
          class="hidden hover:text-gray-900 font-medium transition"
        >
          New
        </button>

        <button
          onclick="toggleHistoryDrawer(true)"
          class="hover:text-gray-900 font-medium transition"
        >
          Saved<span id="saved-count-wrap" class="hidden"> (<span id="saved-count">0</span>)</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <main class="flex-1 flex flex-col">

    <!-- 1. DISTRACTION-FREE HOMEPAGE -->
    <section id="home-hero" class="flex-1 flex flex-col items-center justify-center px-5 py-16 max-w-2xl mx-auto w-full">
      <div class="w-full space-y-8">
        <h1 class="editorial-serif text-3xl sm:text-4xl font-normal tracking-tight text-gray-950 text-center">
          Defend what you believe.
        </h1>

        <!-- Unified Question Composer -->
        <div class="w-full prompt-shell rounded-xl px-3.5 py-3">
          <textarea
            id="home-question-input"
            rows="2"
            placeholder="Ask a difficult question about Christian faith, Scripture, or primary sources..."
            class="w-full resize-none border-0 bg-transparent text-base text-gray-900 placeholder-gray-400 focus:outline-none leading-relaxed"
            onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); submitFromHome(); }"
          ></textarea>

          <div class="flex items-center justify-between gap-3 pt-2 mt-1 border-t border-gray-100">
            <label class="flex items-center gap-1.5 text-xs text-gray-400">
              <span>Lens</span>
              <select
                id="lens-select"
                onchange="setResearchMode(this.value)"
                aria-label="Research lens"
                class="bg-transparent text-gray-600 font-medium focus:outline-none cursor-pointer hover:text-gray-900"
              >
                <option value="exegetical_archive">Exegetical Archive</option>
                <option value="comparative_analysis">Comparative</option>
                <option value="primary_sources">Primary Texts</option>
              </select>
            </label>

            <button
              onclick="submitFromHome()"
              aria-label="Search research answer"
              class="w-8 h-8 rounded-lg accent-bg text-white flex items-center justify-center text-sm font-medium transition"
              title="Research Answer (Enter)"
            >
              →
            </button>
          </div>
        </div>

        <!-- Text-Only Suggested Questions -->
        <div class="pt-2">
          <div class="text-[11px] uppercase tracking-wider text-gray-400 mb-2">
            Start with a question
          </div>
          <div class="divide-y divide-gray-100 border-t border-b border-gray-100 text-sm">
            <button
              type="button"
              data-question="If Jesus is God, why does He pray to the Father?"
              onclick="askFromEl(this)"
              class="w-full py-2.5 text-left text-gray-600 hover:text-gray-950 flex items-center justify-between gap-3 transition group"
            >
              <span>If Jesus is God, why does He pray to the Father?</span>
              <span class="text-gray-300 group-hover:text-gray-600 text-xs transition">→</span>
            </button>

            <button
              type="button"
              data-question="Does the Quran and Sahih al-Bukhari 3448 teach that Jesus is the Word of God in Surah 4:171, and how does that compare with John 1:1?"
              onclick="askFromEl(this)"
              class="w-full py-2.5 text-left text-gray-600 hover:text-gray-950 flex items-center justify-between gap-3 transition group"
            >
              <span>Surah 4:171 vs. John 1:1 — Is Jesus the Word of God?</span>
              <span class="text-gray-300 group-hover:text-gray-600 text-xs transition">→</span>
            </button>

            <button
              type="button"
              data-question="Does the Quran affirm the Bible or contradict it?"
              onclick="askFromEl(this)"
              class="w-full py-2.5 text-left text-gray-600 hover:text-gray-950 flex items-center justify-between gap-3 transition group"
            >
              <span>Does the Quran affirm the Bible or contradict it?</span>
              <span class="text-gray-300 group-hover:text-gray-600 text-xs transition">→</span>
            </button>

            <button
              type="button"
              data-question="Did Jesus deny being God when He asked Why do you call me good in Mark 10:18?"
              onclick="askFromEl(this)"
              class="w-full py-2.5 text-left text-gray-600 hover:text-gray-950 flex items-center justify-between gap-3 transition group"
            >
              <span>Why did Jesus ask &ldquo;Why do you call Me good?&rdquo; in Mark 10:18?</span>
              <span class="text-gray-300 group-hover:text-gray-600 text-xs transition">→</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Quiet Whisper Footer -->
      <footer class="mt-14 pt-6 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[11px] text-gray-400">
        <button onclick="toggleEngineDrawer(true)" class="hover:text-gray-700 transition">
          Archive &amp; Sources
        </button>
        <span>·</span>
        <button onclick="toggleMonoMode()" id="mono-toggle-btn" class="hover:text-gray-700 transition">
          Monochrome: Off
        </button>
        <span class="hidden sm:inline">·</span>
        <span class="hidden sm:inline">Press <kbd class="px-1 py-0.5 rounded border border-gray-200 text-gray-500">/</kbd> to ask</span>
      </footer>
    </section>

    <!-- 2. EDITORIAL CONVERSATION STREAM -->
    <section id="conversation-view" class="hidden flex-1 flex flex-col max-w-2xl w-full mx-auto px-5 pt-8 pb-36">
      <div id="thread-container" class="space-y-12"></div>

      <!-- Unified Sticky Follow-Up Composer -->
      <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-gray-100 py-3 px-5 z-20">
        <div class="max-w-2xl mx-auto space-y-1.5">
          <div class="prompt-shell rounded-xl px-3.5 py-2 flex items-center gap-2">
            <input
              id="followup-input"
              type="text"
              placeholder="Ask a follow-up or test another objection..."
              class="flex-1 bg-transparent py-1 text-sm text-gray-900 placeholder-gray-400 focus:outline-none"
              onkeydown="if(event.key==='Enter') submitFollowUp()"
            />
            <button
              onclick="submitFollowUp()"
              id="followup-btn"
              aria-label="Ask follow-up question"
              class="w-8 h-8 rounded-lg accent-bg text-white flex items-center justify-center text-sm font-medium transition shrink-0"
              title="Ask Follow-Up (Enter)"
            >
              →
            </button>
          </div>
          <div class="flex items-center justify-between text-[11px] text-gray-400 px-1">
            <span>Every claim is traced to primary texts and commentary.</span>
            <div class="flex items-center gap-3">
              <button onclick="toggleMonoMode()" id="mono-toggle-thread" class="hover:text-gray-700 transition">Mono</button>
              <button onclick="toggleEngineDrawer(true)" class="hover:text-gray-700 transition">Archive</button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== DRAWER 1: SAVED RESEARCH ==================== -->
  <div id="history-drawer" class="fixed inset-0 z-40 hidden">
    <div onclick="toggleHistoryDrawer(false)" class="absolute inset-0 drawer-backdrop"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white border-l border-gray-200 shadow-xl flex flex-col">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-semibold text-gray-900">Saved Research</h3>
          <p class="text-xs text-gray-500">Reopen recent questions.</p>
        </div>
        <button onclick="toggleHistoryDrawer(false)" class="text-xs px-2.5 py-1 rounded-md border border-gray-200 text-gray-600 hover:text-gray-900 transition">
          Close
        </button>
      </div>
      <div id="saved-sessions-list" class="p-5 divide-y divide-gray-100 overflow-y-auto flex-1 text-xs"></div>
    </div>
  </div>

  <!-- ==================== DRAWER 2: ARCHIVE & SOURCES (HIDDEN BY DEFAULT) ==================== -->
  <div id="engine-drawer" class="fixed inset-0 z-40 hidden">
    <div onclick="toggleEngineDrawer(false)" class="absolute inset-0 drawer-backdrop"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-2xl bg-white border-l border-gray-200 shadow-xl flex flex-col">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
        <div>
          <h3 class="text-sm font-semibold text-gray-900">Archive &amp; Sources</h3>
          <p class="text-xs text-gray-500">
            <span id="hdr-sources">-</span> Commentaries · <span id="hdr-scriptures">-</span> Primary Passages
          </p>
        </div>
        <button onclick="toggleEngineDrawer(false)" class="text-xs px-2.5 py-1 rounded-md border border-gray-200 text-gray-600 hover:text-gray-900 transition">
          Close
        </button>
      </div>

      <div class="px-5 pt-2 border-b border-gray-100 flex gap-6 text-xs">
        <button onclick="switchEngineTab('sources')" id="eng-tab-btn-sources" class="pb-2.5 border-b-2 border-gray-900 text-gray-900 font-semibold">
          Source Catalog
        </button>
        <button onclick="switchEngineTab('hermes')" id="eng-tab-btn-hermes" class="pb-2.5 border-b-2 border-transparent text-gray-500 hover:text-gray-900 font-medium">
          Index Maintenance
        </button>
      </div>

      <div class="p-5 overflow-y-auto flex-1 space-y-6">
        <!-- Tab 1: Source Catalog & Study Splitter -->
        <div id="eng-tab-sources" class="space-y-5">
          <div id="sources-container" class="divide-y divide-gray-100"></div>

          <details class="quiet-disclosure border-t border-gray-100 pt-4">
            <summary class="flex items-center justify-between text-xs font-semibold text-gray-700 hover:text-gray-950">
              <span>Add &amp; Split Study Text</span>
              <span class="disclosure-plus text-gray-400">+</span>
              <span class="disclosure-minus text-gray-400">−</span>
            </summary>
            <div class="mt-3 space-y-2.5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <input id="ing-title" type="text" value="Jesus' Sinlessness in Surah 19:19 and Sahih Muslim 2365 vs. Romans 3:23" class="rounded-md border border-gray-200 bg-white px-3 py-1.5 text-gray-900" />
                <input id="ing-url" type="text" value="https://biblehub.com/commentaries/hebrews/4-15.htm" class="rounded-md border border-gray-200 bg-white px-3 py-1.5 text-gray-900" />
              </div>
              <textarea id="ing-text" rows="4" class="w-full rounded-md border border-gray-200 bg-white p-2.5 text-xs text-gray-800 font-mono"># Objection on Human Prophets:
Critics argue that Jesus being sinless in Surah 19:19 and Sahih Muslim 2365 merely reflects general prophetic protection ('ismah) rather than divine nature.

# Rebuttal from Primary Texts and Scripture:
Classical exegesis notes that the primary texts refute this claim: whereas other prophets ask forgiveness for their sins (Surah 40:55, Surah 47:19), Sahih Muslim 2365 explicitly declares that every human child is touched by Satan at birth except Jesus and Mary, echoing Hebrews 4:15 and 1 Peter 2:22.</textarea>
              <div class="flex items-center justify-between gap-2">
                <button onclick="stageCustomArticle()" class="px-3.5 py-1.5 rounded-md accent-bg text-white text-xs font-medium transition">
                  Stage for Review
                </button>
                <span id="ing-feedback" class="text-xs text-gray-600"></span>
              </div>
            </div>
          </details>
        </div>

        <!-- Tab 2: Index Maintenance & Quality Benchmark -->
        <div id="eng-tab-hermes" class="hidden space-y-5">
          <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="runHermesJob('discover')" class="p-3 rounded-lg surface-card hover:border-gray-300 text-left transition">
              <div class="font-semibold text-gray-900">Scan Catalog Indexes</div>
              <p class="text-[11px] text-gray-500 mt-0.5">Detect unindexed studies.</p>
            </button>
            <button onclick="runHermesJob('normalize')" class="p-3 rounded-lg surface-card hover:border-gray-300 text-left transition">
              <div class="font-semibold text-gray-900">Audit &amp; Pair Chunks</div>
              <p class="text-[11px] text-gray-500 mt-0.5">Verify objection-rebuttal links.</p>
            </button>
            <button onclick="runHermesJob('qa_benchmark')" class="p-3 rounded-lg surface-card hover:border-gray-300 text-left transition">
              <div class="font-semibold text-gray-900">Run Quality Suite</div>
              <p class="text-[11px] text-gray-500 mt-0.5">Verify recall and citations.</p>
            </button>
            <button onclick="runHermesJob('gap_analysis')" class="p-3 rounded-lg surface-card hover:border-gray-300 text-left transition">
              <div class="font-semibold text-gray-900">Analyze Query Gaps</div>
              <p class="text-[11px] text-gray-500 mt-0.5">Inspect unanswered queries.</p>
            </button>
          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-semibold text-gray-500">Review Queue</h4>
            <div id="hermes-jobs-list" class="space-y-2"></div>
          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-semibold text-gray-500">Verification Suite</h4>
            <div id="gold-questions-list" class="divide-y divide-gray-100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== APPLICATION LOGIC ==================== -->
  <script>
    let currentResearchMode = 'exegetical_archive';
    let activeParentContext = '';
    let savedSessions = [];

    try {
      savedSessions = JSON.parse(localStorage.getItem('defend_the_faith_sessions') || '[]');
    } catch (e) {
      savedSessions = [];
    }

    function applyMonoMode(enabled) {
      document.documentElement.classList.toggle('mono-mode', enabled);
      const homeBtn = document.getElementById('mono-toggle-btn');
      const threadBtn = document.getElementById('mono-toggle-thread');
      if (homeBtn) homeBtn.textContent = `Monochrome: ${enabled ? 'On' : 'Off'}`;
      if (threadBtn) threadBtn.textContent = enabled ? 'Mono: On' : 'Mono';
    }

    function toggleMonoMode() {
      const next = !document.documentElement.classList.contains('mono-mode');
      applyMonoMode(next);
      try {
        localStorage.setItem('defend_the_faith_mono', next ? '1' : '0');
      } catch (e) {}
    }

    function updateSavedCount() {
      const wrap = document.getElementById('saved-count-wrap');
      const countEl = document.getElementById('saved-count');
      countEl.textContent = savedSessions.length;
      wrap.classList.toggle('hidden', savedSessions.length === 0);
    }

    function saveSessionItem(question, answerData) {
      if (!question || !answerData) return;
      savedSessions = savedSessions.filter(s => s.question.toLowerCase() !== question.toLowerCase());
      savedSessions.unshift({
        question,
        classification: answerData.classification,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        data: answerData
      });
      if (savedSessions.length > 15) savedSessions.pop();
      try {
        localStorage.setItem('defend_the_faith_sessions', JSON.stringify(savedSessions));
      } catch (e) {}
      updateSavedCount();
    }

    async function apiJson(path, options = {}) {
      try {
        const res = await fetch(path, options);
        if (res.ok && (res.headers.get('content-type') || '').includes('application/json')) {
          return await res.json();
        }
      } catch (e) {}

      const archive = await getArchiveData();
      if (path === '/api/status') return archive.status;
      if (path === '/api/sources') return archive.catalog;
      if (path === '/api/hermes/dashboard') return archive.dashboard;
      if (path === '/api/research/query') {
        const body = options.body ? JSON.parse(options.body) : {};
        return await queryArchiveClient(body.question || '', body.parent_context || '', body.research_mode || 'exegetical_archive');
      }
      return {};
    }

    async function refreshStatus() {
      try {
        const data = await apiJson('/api/status');
        document.getElementById('hdr-sources').textContent = data.counts.sources;
        document.getElementById('hdr-scriptures').textContent = data.counts.scriptures;
      } catch (e) {}
    }

    function setResearchMode(mode) {
      currentResearchMode = mode;
      const sel = document.getElementById('lens-select');
      if (sel && sel.value !== mode) sel.value = mode;
    }

    function resetToHome() {
      activeParentContext = '';
      document.getElementById('home-hero').classList.remove('hidden');
      document.getElementById('conversation-view').classList.add('hidden');
      document.getElementById('nav-new-btn').classList.add('hidden');
      document.getElementById('thread-container').innerHTML = '';
      document.getElementById('home-question-input').value = '';
      document.getElementById('home-question-input').focus();
    }

    function submitFromHome() {
      const q = document.getElementById('home-question-input').value.trim();
      if (!q) return;
      askQuestion(q, '');
    }

    function submitFollowUp() {
      const input = document.getElementById('followup-input');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      askQuestion(q, activeParentContext);
    }

    function askFromEl(el) {
      const q = el.dataset.question;
      if (!q) return;
      toggleHistoryDrawer(false);
      askQuestion(q, '');
    }

    async function askQuestion(question, parentContext = '') {
      document.getElementById('home-hero').classList.add('hidden');
      document.getElementById('conversation-view').classList.remove('hidden');
      document.getElementById('nav-new-btn').classList.remove('hidden');

      const thread = document.getElementById('thread-container');
      const turnId = 'turn-' + Date.now();

      const turnWrapper = document.createElement('article');
      turnWrapper.id = turnId;
      turnWrapper.className = 'space-y-6 border-b border-gray-100 pb-10';
      turnWrapper.innerHTML = `
        <div>
          ${parentContext ? `<div class="text-xs text-gray-400 mb-1">Follow-up · ${escapeHtml(parentContext)}</div>` : ''}
          <h2 class="editorial-serif text-2xl sm:text-3xl text-gray-950 font-normal leading-snug">
            ${escapeHtml(question)}
          </h2>
        </div>
        <div class="py-4 text-sm text-gray-400 animate-pulse">
          Consulting primary passages and commentary...
        </div>
      `;
      thread.appendChild(turnWrapper);
      turnWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });

      try {
        const data = await apiJson('/api/research/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            parent_context: parentContext,
            research_mode: currentResearchMode,
            use_llm: true
          })
        });
        activeParentContext = question;
        saveSessionItem(question, data);
        turnWrapper.innerHTML = buildTurnHtml(data, turnId);
        refreshStatus();
      } catch (err) {
        turnWrapper.innerHTML = `
          <div class="py-3 text-sm text-red-700">
            Unable to complete research query: ${escapeHtml(err.message)}
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function copyResponseText(btn) {
      const text = btn.dataset.copy || '';
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(text).then(() => {
        const prev = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = prev; }, 1600);
      });
    }

    function buildTurnHtml(data, turnId) {
      if (data.abstained) {
        return `
          <div class="space-y-5">
            <div>
              <div class="text-[11px] uppercase tracking-wider accent-text font-semibold mb-1">
                ${escapeHtml(data.classification)}
              </div>
              <h2 class="editorial-serif text-2xl sm:text-3xl text-gray-950 leading-snug">${escapeHtml(data.question)}</h2>
            </div>

            <p class="text-[15px] text-gray-800 leading-relaxed">
              ${escapeHtml(data.direct_answer || data.short_answer)}
            </p>

            ${(data.explore_further || []).length ? `
              <div class="pt-3 border-t border-gray-100 space-y-2">
                <div class="text-xs text-gray-400">Available in the archive</div>
                <div class="divide-y divide-gray-100 text-sm">
                  ${(data.explore_further || []).map(q => `
                    <button type="button" data-question="${escapeHtml(q)}" onclick="askFromEl(this)" class="w-full py-2 text-left text-gray-700 hover:text-gray-950 flex items-center justify-between gap-2 transition">
                      <span>${escapeHtml(q)}</span>
                      <span class="text-gray-400 text-xs">→</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      const primaryList = data.primary_evidence || [];
      const archiveArgs = data.archive_arguments || [];
      const sourceNames = primaryList.map(sp => sp.reference).filter(Boolean).slice(0, 4);

      const scripturesHtml = primaryList.map(sp => `
        <div class="py-3 space-y-1.5">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <span class="text-sm font-semibold text-gray-950">${escapeHtml(sp.reference)}</span>
            <span class="text-[11px] text-gray-400">
              ${escapeHtml(sp.corpus)} · ${escapeHtml(sp.translation)}
            </span>
          </div>
          <blockquote class="editorial-serif text-sm text-gray-800 italic leading-relaxed">
            &ldquo;${escapeHtml(sp.text_content)}&rdquo;
          </blockquote>
          ${sp.original_language_note ? `
            <p class="text-xs text-gray-500 leading-relaxed">
              ${escapeHtml(sp.original_language_note)}
            </p>
          ` : ''}
        </div>
      `).join('');

      const archiveArgsHtml = archiveArgs.map(arg => `
        <div class="py-3 space-y-1.5">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <span class="text-sm font-semibold text-gray-900">${escapeHtml(arg.section_title)}</span>
            <span class="text-[11px] text-gray-400">${escapeHtml(arg.author || 'Exegetical Research Archive')}</span>
          </div>
          <blockquote class="text-sm text-gray-700 border-l-2 border-gray-300 pl-3 leading-relaxed">
            &ldquo;${escapeHtml(arg.verbatim_quote)}&rdquo;
          </blockquote>
          ${arg.how_it_supports ? `
            <p class="text-xs text-gray-500">${escapeHtml(arg.how_it_supports)}</p>
          ` : ''}
          <div class="text-xs text-gray-500 pt-0.5">
            <a href="${escapeHtml(arg.source_url)}" target="_blank" rel="noopener" class="accent-text hover:underline font-medium">
              ${escapeHtml(arg.source_title)} ↗
            </a>
          </div>
        </div>
      `).join('');

      const reasoningHtml = (data.logical_reasoning || []).map((step, i) => `
        <li class="flex items-baseline gap-3 text-sm leading-relaxed">
          <span class="text-xs font-semibold accent-text shrink-0 w-4">${i + 1}.</span>
          <div class="text-gray-800">
            <span class="font-medium text-gray-950">${escapeHtml(step.step_type)}:</span>
            ${escapeHtml(step.statement)}
          </div>
        </li>
      `).join('');

      const counter = data.counterargument;
      const counterSection = counter ? `
        <div class="pt-5 border-t border-gray-100 space-y-3">
          <div class="text-xs font-medium text-gray-400">Common Objection &amp; Response</div>
          <div class="space-y-2.5">
            <p class="text-sm text-gray-600 italic leading-relaxed">
              <span class="not-italic font-medium text-gray-800">${escapeHtml(counter.objection_title)}:</span>
              &ldquo;${escapeHtml(counter.objection_claim)}&rdquo;
            </p>
            <p class="text-[15px] text-gray-900 leading-relaxed">
              ${escapeHtml(counter.exegetical_rebuttal)}
            </p>
          </div>
        </div>
      ` : '';

      const convReady = data.conversation_ready_response ? `
        <div class="surface-note rounded-r-lg px-4 py-3.5 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[11px] font-semibold uppercase tracking-wider accent-text">
              In Conversation
            </span>
            <button
              type="button"
              onclick="copyResponseText(this)"
              data-copy="${escapeHtml(data.conversation_ready_response)}"
              class="text-xs text-gray-500 hover:text-gray-900 font-medium transition"
            >
              Copy
            </button>
          </div>
          <p class="editorial-serif text-[15px] text-gray-900 leading-relaxed">
            ${escapeHtml(data.conversation_ready_response)}
          </p>
        </div>
      ` : '';

      const sourcesSummaryText = sourceNames.length
        ? `Primary Texts &amp; Sources — ${escapeHtml(sourceNames.join(', '))}`
        : `Primary Texts &amp; Sources (${primaryList.length + archiveArgs.length})`;

      const sourcesDisclosure = (primaryList.length || archiveArgs.length) ? `
        <details class="quiet-disclosure pt-5 border-t border-gray-100">
          <summary class="flex items-center justify-between gap-3 py-1 text-xs font-medium text-gray-600 hover:text-gray-950 transition">
            <span>${sourcesSummaryText}</span>
            <span class="disclosure-plus text-gray-400 text-sm leading-none shrink-0">+</span>
            <span class="disclosure-minus text-gray-400 text-sm leading-none shrink-0">−</span>
          </summary>
          <div class="mt-2 divide-y divide-gray-100">
            ${scripturesHtml}
            ${archiveArgsHtml}
          </div>
        </details>
      ` : '';

      const rebuttalBranchesHtml = (data.rebuttal_tree || []).map((branch, idx) => {
        const branchDomId = `${turnId}-branch-${idx}`;
        return `
          <div id="${branchDomId}" class="rebuttal-branch pl-3.5">
            <button
              type="button"
              data-branch-id="${branchDomId}"
              data-branch-question="${escapeHtml(branch.question)}"
              data-parent-question="${escapeHtml(data.question)}"
              onclick="toggleRebuttalFromEl(this)"
              class="w-full py-2.5 text-left flex items-center justify-between gap-3 text-sm text-gray-800 hover:text-gray-950 transition group"
            >
              <span>${escapeHtml(branch.question)}</span>
              <span id="${branchDomId}-icon" class="text-sm text-gray-400 group-hover:text-gray-900 shrink-0 font-normal">+</span>
            </button>
            <div id="${branchDomId}-body" class="hidden pb-3 pt-1 space-y-3"></div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-6">
          <!-- Question Header -->
          <div>
            <div class="text-[11px] font-semibold uppercase tracking-wider accent-text mb-1">
              ${escapeHtml(data.classification)}
            </div>
            <h2 class="editorial-serif text-2xl sm:text-3xl text-gray-950 font-normal leading-snug">
              ${escapeHtml(data.question)}
            </h2>
          </div>

          <!-- Direct Answer (Unboxed Editorial Prose) -->
          <p class="text-base text-gray-900 leading-relaxed">
            ${escapeHtml(data.direct_answer || data.short_answer)}
          </p>

          <!-- In Conversation (Core Practical Takeaway) -->
          ${convReady}

          <!-- Logical Reasoning -->
          ${reasoningHtml ? `
            <div class="pt-2 space-y-2.5">
              <div class="text-xs font-medium text-gray-400">Line of Reasoning</div>
              <ol class="space-y-2">
                ${reasoningHtml}
              </ol>
            </div>
          ` : ''}

          <!-- Common Objection & Response -->
          ${counterSection}

          <!-- Primary Texts & Citations (Progressive Disclosure) -->
          ${sourcesDisclosure}

          <!-- Prepare for Next Objections -->
          ${rebuttalBranchesHtml ? `
            <div class="pt-5 border-t border-gray-100 space-y-2">
              <div class="text-xs font-medium text-gray-400">Likely Follow-Up Objections</div>
              <div class="divide-y divide-gray-100">
                ${rebuttalBranchesHtml}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleRebuttalFromEl(el) {
      toggleRebuttalBranch(
        el.dataset.branchId,
        el.dataset.branchQuestion,
        el.dataset.parentQuestion
      );
    }

    async function toggleRebuttalBranch(branchDomId, branchQuestion, parentQuestion) {
      const branchWrap = document.getElementById(branchDomId);
      const bodyEl = document.getElementById(`${branchDomId}-body`);
      const iconEl = document.getElementById(`${branchDomId}-icon`);

      if (!bodyEl.classList.contains('hidden')) {
        bodyEl.classList.add('hidden');
        branchWrap.classList.remove('expanded');
        iconEl.textContent = '+';
        return;
      }

      bodyEl.classList.remove('hidden');
      branchWrap.classList.add('expanded');
      iconEl.textContent = '−';

      if (bodyEl.dataset.loaded === 'true') {
        return;
      }

      bodyEl.innerHTML = `<div class="text-xs text-gray-400 animate-pulse">Loading response...</div>`;

      try {
        const data = await apiJson('/api/research/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: branchQuestion,
            parent_context: parentQuestion,
            research_mode: currentResearchMode,
            use_llm: true
          })
        });
        bodyEl.dataset.loaded = 'true';

        const subBranches = (data.rebuttal_tree || []).slice(0, 2).map((sb, sIdx) => {
          const subId = `${branchDomId}-sub-${sIdx}`;
          return `
            <div id="${subId}" class="rebuttal-branch pl-3">
              <button
                type="button"
                data-branch-id="${subId}"
                data-branch-question="${escapeHtml(sb.question)}"
                data-parent-question="${escapeHtml(branchQuestion)}"
                onclick="toggleRebuttalFromEl(this)"
                class="w-full py-2 text-left flex items-center justify-between gap-2 text-xs text-gray-700 hover:text-gray-950 transition"
              >
                <span>↳ ${escapeHtml(sb.question)}</span>
                <span id="${subId}-icon" class="text-gray-400 shrink-0">+</span>
              </button>
              <div id="${subId}-body" class="hidden pb-2 pt-1 space-y-2"></div>
            </div>
          `;
        }).join('');

        bodyEl.innerHTML = `
          <div class="space-y-3 text-sm">
            <p class="text-gray-800 leading-relaxed">
              ${escapeHtml(data.direct_answer || data.short_answer)}
            </p>
            ${(data.primary_evidence || []).slice(0, 2).map(sp => `
              <div class="text-xs text-gray-600 space-y-0.5 pl-3 border-l border-gray-200">
                <div class="font-semibold text-gray-900">${escapeHtml(sp.reference)}</div>
                <div class="editorial-serif italic">&ldquo;${escapeHtml(sp.text_content)}&rdquo;</div>
              </div>
            `).join('')}
            ${(data.archive_arguments || []).slice(0, 1).map(arg => `
              <div class="text-xs">
                <a href="${escapeHtml(arg.source_url)}" target="_blank" rel="noopener" class="accent-text hover:underline font-medium">
                  ${escapeHtml(arg.source_title)} ↗
                </a>
              </div>
            `).join('')}
            ${subBranches ? `<div class="pt-1 space-y-1">${subBranches}</div>` : ''}
          </div>
        `;
      } catch (e) {
        bodyEl.innerHTML = `<div class="text-xs text-red-700">Failed to load branch: ${escapeHtml(e.message)}</div>`;
      }
    }

    function toggleHistoryDrawer(open) {
      const el = document.getElementById('history-drawer');
      el.classList.toggle('hidden', !open);
      if (open) renderSavedSessions();
    }

    function renderSavedSessions() {
      const list = document.getElementById('saved-sessions-list');
      if (!savedSessions.length) {
        list.innerHTML = `<p class="text-gray-400 text-xs py-2">No saved research yet.</p>`;
        return;
      }
      list.innerHTML = savedSessions.map((s) => `
        <button
          type="button"
          data-question="${escapeHtml(s.question)}"
          onclick="askFromEl(this)"
          class="w-full py-3 text-left space-y-1 block hover:bg-gray-50/70 transition"
        >
          <div class="flex items-center justify-between text-[11px] text-gray-400">
            <span class="uppercase font-medium accent-text">${escapeHtml(s.classification || 'Research')}</span>
            <span>${escapeHtml(s.timestamp || '')}</span>
          </div>
          <div class="text-xs font-medium text-gray-900">${escapeHtml(s.question)}</div>
        </button>
      `).join('');
    }

    function toggleEngineDrawer(open) {
      const el = document.getElementById('engine-drawer');
      el.classList.toggle('hidden', !open);
      if (open) {
        loadSourcesCatalog();
        loadHermesDashboard();
      }
    }

    function switchEngineTab(tab) {
      ['sources', 'hermes'].forEach(t => {
        document.getElementById(`eng-tab-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`eng-tab-btn-${t}`);
        if (t === tab) {
          btn.className = 'pb-2.5 border-b-2 border-gray-900 text-gray-900 font-semibold';
        } else {
          btn.className = 'pb-2.5 border-b-2 border-transparent text-gray-500 hover:text-gray-900 font-medium';
        }
      });
    }

    async function stageCustomArticle() {
      const title = document.getElementById('ing-title').value;
      const url = document.getElementById('ing-url').value;
      const raw_text = document.getElementById('ing-text').value;
      const fb = document.getElementById('ing-feedback');
      fb.textContent = 'Splitting & staging...';

      try {
        const res = await fetch('/api/hermes/ingest-preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, url, raw_text })
        });
        const data = await res.json();
        if (data.error) {
          fb.textContent = `Error: ${data.error}`;
          return;
        }
        fb.textContent = `Staged ${data.chunks.length} chunks in Review Queue.`;
        await refreshStatus();
        await loadHermesDashboard();
        switchEngineTab('hermes');
      } catch (e) {
        fb.textContent = 'Unavailable in static preview.';
      }
    }

    async function loadSourcesCatalog() {
      const data = await apiJson('/api/sources');
      const container = document.getElementById('sources-container');
      container.innerHTML = (data.sources || []).map(src => `
        <div class="py-3 space-y-1 text-xs">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <span class="text-sm font-medium text-gray-900">${escapeHtml(src.title)}</span>
            <span class="text-[11px] text-gray-400">${escapeHtml(src.topic)}</span>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 text-gray-500">
            <span>${escapeHtml(src.author)}</span>
            <a href="${escapeHtml(src.url)}" target="_blank" rel="noopener" class="accent-text hover:underline truncate max-w-xs">${escapeHtml(src.url)} ↗</a>
          </div>
        </div>
      `).join('');
    }

    async function loadHermesDashboard() {
      const data = await apiJson('/api/hermes/dashboard');

      const jobsContainer = document.getElementById('hermes-jobs-list');
      jobsContainer.innerHTML = (data.jobs || []).map(job => `
        <div class="p-3 rounded-lg surface-card space-y-1.5 text-xs">
          <div class="flex items-center justify-between gap-2">
            <span class="font-medium text-gray-900">${escapeHtml(job.title)}</span>
            <span class="text-[10px] uppercase text-gray-500">${escapeHtml(job.status.replace('_', ' '))}</span>
          </div>
          <p class="text-gray-600">${escapeHtml(job.summary)}</p>
          ${job.status === 'needs_approval' ? `
            <div class="flex items-center gap-2 pt-1">
              <button onclick="approveJob('${job.id}')" class="px-2.5 py-1 rounded accent-bg text-white font-medium">
                Approve
              </button>
              <button onclick="rejectJob('${job.id}')" class="px-2.5 py-1 rounded border border-gray-200 bg-white text-gray-700">
                Reject
              </button>
            </div>
          ` : ''}
        </div>
      `).join('');

      const gqContainer = document.getElementById('gold-questions-list');
      gqContainer.innerHTML = (data.gold_questions || []).map(gq => `
        <div class="py-2 flex items-center justify-between gap-2 text-xs">
          <span class="text-gray-700">${escapeHtml(gq.question)}</span>
          <span class="text-[11px] text-gray-500 shrink-0">${escapeHtml(gq.last_status)} (${gq.last_score})</span>
        </div>
      `).join('');
    }

    async function runHermesJob(jobType) {
      await fetch(`/api/hermes/run/${jobType}`, { method: 'POST' });
      await loadHermesDashboard();
      await refreshStatus();
    }

    async function approveJob(jobId) {
      await fetch(`/api/hermes/jobs/${jobId}/approve`, { method: 'POST' });
      await loadHermesDashboard();
      await refreshStatus();
    }

    async function rejectJob(jobId) {
      await fetch(`/api/hermes/jobs/${jobId}/reject`, { method: 'POST' });
      await loadHermesDashboard();
      await refreshStatus();
    }

    // Keyboard shortcuts: / focuses prompt, Esc closes drawers, Ctrl/Cmd+K resets home
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        toggleHistoryDrawer(false);
        toggleEngineDrawer(false);
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        resetToHome();
        return;
      }
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        const inThread = !document.getElementById('conversation-view').classList.contains('hidden');
        const target = document.getElementById(inThread ? 'followup-input' : 'home-question-input');
        if (target) target.focus();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      try {
        applyMonoMode(localStorage.getItem('defend_the_faith_mono') === '1');
      } catch (e) {}
      updateSavedCount();
      refreshStatus();
    });
  </script>
</body>
</html>
